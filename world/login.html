<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>bold700 HQ · inloggen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  :root { --ground: #070a14; --panel: rgba(16, 21, 42, 0.86); --line: rgba(160, 176, 220, 0.16); --text: #e8ebf5; --muted: #8e97b1; --accent: #ffd27a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; padding: 16px; display: grid; place-items: center; background: radial-gradient(1200px 800px at 70% 20%, #16203a 0%, var(--ground) 60%); color: var(--text); font: 14px/1.45 "IBM Plex Sans", system-ui, sans-serif; }
  form { width: min(380px, 100%); padding: 26px 24px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); }
  h1 { margin: 0 0 4px; font: 800 24px/1 "Syne", sans-serif; }
  h1 span { color: var(--accent); }
  p { margin: 0 0 18px; color: var(--muted); }
  label { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; border-radius: 8px; background: #10152a; border: 1px solid var(--line); color: var(--text); font: inherit; font-size: 15px; outline: none; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255, 210, 122, .18); }
  button { margin-top: 14px; width: 100%; padding: 11px; border: 0; border-radius: 8px; background: var(--accent); color: #1a1408; font: 500 14px "IBM Plex Sans", sans-serif; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { margin: 10px 0 0; min-height: 1.2em; font: 12px "IBM Plex Mono", monospace; color: #ff8a80; }
</style>
</head>
<body>
<form id="f">
  <h1>bold700 <span>HQ</span></h1>
  <p>De galaxy is alleen voor de bemanning. Vul het wachtwoord in.</p>
  <label for="pw">Wachtwoord</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button id="go" type="submit">Aan boord</button>
  <p class="err" id="err" aria-live="polite"></p>
</form>
<script>
  const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
  f.addEventListener("submit", async (e) => {
    e.preventDefault(); err.textContent = ""; go.disabled = true;
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: document.getElementById("pw").value }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "Inloggen mislukt");
      const next = new URLSearchParams(location.search).get("next") || "/";
      location.href = next.startsWith("/") ? next : "/";
    } catch (x) { err.textContent = x.message; } finally { go.disabled = false; }
  });
</script>
</body>
</html>
